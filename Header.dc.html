<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/colors.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/typography.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/base.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/styles.css">
  <script src="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/_ds_bundle.js"></script>
</helmet>
<header style="position:sticky;top:0;z-index:200;background:var(--surface-page);border-bottom:1px solid var(--border-subtle)">
  <div style="max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="Home.dc.html" style="display:flex;align-items:center;flex-shrink:0">
      <img src="assets/logo-signature-positiva.svg" alt="Vinícolo" style="height:42px;display:block">
    </a>
    <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;align-items:center;gap:28px">
      <a href="Home.dc.html" style="{{ linkStyle_home }}">Início</a>
      <a href="Loja.dc.html" style="{{ linkStyle_loja }}">Vinhos</a>
      <a href="Eventos.dc.html" style="{{ linkStyle_eventos }}">Eventos</a>
      <a href="Blog.dc.html" style="{{ linkStyle_blog }}">Blog</a>
      <a href="Sobre.dc.html" style="{{ linkStyle_sobre }}">Sobre</a>
      <a href="Contato.dc.html" style="{{ linkStyle_contato }}">Contato</a>
    </nav>
    <div style="flex-shrink:0">
      <x-import component-from-global-scope="VinColoDesignSystem_84af61.Button" hint-size="auto,44px" variant="primary" size="md" onClick="{{ goToLoja }}">Comprar vinhos</x-import>
    </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-label="Abrir menu" style="background:none;border:none;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:5px;flex-shrink:0">
      <span style="width:26px;height:2px;background:var(--text-heading);display:block"></span>
      <span style="width:26px;height:2px;background:var(--text-heading);display:block"></span>
      <span style="width:26px;height:2px;background:var(--text-heading);display:block"></span>
    </button>
    </sc-if>
  </div>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="{{ mobileMenuStyle }}">
    <a href="Home.dc.html" style="{{ linkStyle_home }};font-size:var(--text-md)">Início</a>
    <a href="Loja.dc.html" style="{{ linkStyle_loja }};font-size:var(--text-md)">Vinhos</a>
    <a href="Eventos.dc.html" style="{{ linkStyle_eventos }};font-size:var(--text-md)">Eventos</a>
    <a href="Blog.dc.html" style="{{ linkStyle_blog }};font-size:var(--text-md)">Blog</a>
    <a href="Sobre.dc.html" style="{{ linkStyle_sobre }};font-size:var(--text-md)">Sobre</a>
    <a href="Contato.dc.html" style="{{ linkStyle_contato }};font-size:var(--text-md)">Contato</a>
    <div style="padding-top:8px">
      <x-import component-from-global-scope="VinColoDesignSystem_84af61.Button" hint-size="100%,44px" variant="primary" size="md" style="width:100%" onClick="{{ goToLoja }}">Comprar vinhos</x-import>
    </div>
  </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;loja&quot;,&quot;eventos&quot;,&quot;blog&quot;,&quot;sobre&quot;,&quot;contato&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' ? window.innerWidth < 900 : false, menuOpen: false };

  componentDidMount() {
    this._onResize = () => {
      const isMobile = window.innerWidth < 900;
      if (isMobile !== this.state.isMobile) this.setState({ isMobile, menuOpen: false });
    };
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }

  linkStyleFor(page) {
    const active = this.props.active === page;
    return `font-family:var(--font-body);font-size:var(--text-base);font-weight:${active ? 'var(--weight-semibold)' : 'var(--weight-medium)'};color:${active ? 'var(--brand-primary)' : 'var(--text-body)'};text-decoration:none;padding:4px 0;border-bottom:2px solid ${active ? 'var(--brand-primary)' : 'transparent'}`;
  }

  renderVals() {
    return {
      isMobile: this.state.isMobile,
      linkStyle_home: this.linkStyleFor('home'),
      linkStyle_loja: this.linkStyleFor('loja'),
      linkStyle_eventos: this.linkStyleFor('eventos'),
      linkStyle_blog: this.linkStyleFor('blog'),
      linkStyle_sobre: this.linkStyleFor('sobre'),
      linkStyle_contato: this.linkStyleFor('contato'),
      mobileMenuStyle: `display:flex;flex-direction:column;gap:14px;padding:${this.state.menuOpen ? '4px 20px 20px' : '0 20px'};max-height:${this.state.menuOpen ? '400px' : '0'};overflow:hidden;transition:all 200ms ease;border-top:${this.state.menuOpen ? '1px solid var(--border-subtle)' : 'none'}`,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      goToLoja: () => { window.location.href = 'Loja.dc.html'; },
    };
  }
}

</script>
</body>
</html>
