<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/colors.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/typography.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/base.css">
  <link rel="stylesheet" href="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/styles.css">
  <script src="_ds/vin-colo-design-system-84af6143-e906-4176-9ce6-01943ac4ff38/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <title>Blog — Vinícolo</title>
  <meta name="description" content="Notas de degustação, harmonização e bastidores da loja de vinhos, escritos pelo Guilherme, da Vinícolo.">
  <style>
    body { margin: 0; background: var(--surface-page); }
    a { color: var(--text-link); }
    a:hover { color: var(--text-link-hover); }
  </style>
</helmet>
<dc-import name="AgeGate" hint-size="0,0" style="display:contents"></dc-import>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="Header" active="blog" hint-size="100%,80px"></dc-import>

  <section style="background:var(--surface-sunken);padding:56px 20px 32px">
    <div style="max-width:1200px;margin:0 auto">
      <h1 style="margin:0 0 10px;font-family:var(--font-display);font-size:var(--text-2xl);color:var(--text-heading)">Blog</h1>
      <p style="margin:0;font-family:var(--font-body);font-size:var(--text-base);color:var(--text-body);max-width:640px;line-height:var(--leading-normal)">Notas de degustação, dicas de harmonização e os bastidores da vinícola, escritos pelo Guilherme.</p>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:32px 20px 80px;width:100%;box-sizing:border-box;flex:1">
    <x-import component-from-global-scope="VinColoDesignSystem_84af61.Tabs" hint-size="auto,44px" tabs="{{ categoryTabs }}" active="{{ activeCategory }}" onChange="{{ setCategory }}" style="margin-bottom:28px"></x-import>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px">
      <sc-for list="{{ filtered }}" as="post" hint-placeholder-count="6">
        <a href="Post.dc.html#{{ post.id }}" style="text-decoration:none;display:flex;flex-direction:column;gap:12px">
          <image-slot id="blog-{{ post.id }}" shape="rounded" radius="16" placeholder="Imagem do post" style="width:100%;aspect-ratio:16/10"></image-slot>
          <span style="font-family:var(--font-body);font-size:var(--text-xs);font-weight:700;letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--brand-primary)">{{ post.categoria }}</span>
          <h2 style="margin:0;font-family:var(--font-display);font-size:var(--text-md);color:var(--text-heading);line-height:var(--leading-snug)">{{ post.titulo }}</h2>
          <p style="margin:0;font-family:var(--font-body);font-size:var(--text-sm);color:var(--text-body);line-height:var(--leading-snug)">{{ post.resumo }}</p>
          <span style="font-family:var(--font-body);font-size:var(--text-sm);color:var(--text-muted)">{{ post.dataFmt }} · {{ post.leitura }} de leitura</span>
        </a>
      </sc-for>
    </div>
  </section>

  <div style="margin-top:auto">
    <dc-import name="Footer" hint-size="100%,320px"></dc-import>
  </div>
</div>
<dc-import name="WhatsAppButton" hint-size="0,0" style="display:contents"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
function fmtData(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
}

class Component extends DCLogic {
  state = { allPosts: [], activeCategory: 'todos' };
  componentDidMount() {
    import('./data.js').then(m => this.setState({ allPosts: m.POSTS }));
  }
  renderVals() {
    const filtered = this.state.allPosts
      .filter(p => this.state.activeCategory === 'todos' || p.categoria === this.state.activeCategory)
      .map(p => ({ ...p, dataFmt: fmtData(p.data) }));
    return {
      categoryTabs: [
        { value: 'todos', label: 'Todos' },
        { value: 'Notas de Degustação', label: 'Notas de Degustação' },
        { value: 'Harmonização', label: 'Harmonização' },
        { value: 'Bastidores da Vinícola', label: 'Bastidores da Vinícola' },
      ],
      activeCategory: this.state.activeCategory,
      setCategory: (v) => this.setState({ activeCategory: v }),
      filtered,
    };
  }
}

</script>
</body>
</html>
